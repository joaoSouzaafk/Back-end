<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Abastecendo o carro</title>
</head>

<body>

    <h1>⛽ Abastecendo o carro</h1>

    <form action="ex1.php" method="post">

        <label>Quantidade de litros:</label>
        <input type="number" name="litros" step="0.01" required>

        <br><br>

        <p>Digite 1 para Gasolina</p>
        <p>Digite 2 para Etanol</p>
        <p>Digite 3 para Diesel</p>

        <input type="number" name="combustivel" required>

        <br><br>

        <button type="submit">Calcular</button>

    </form>

</body>

</html>
